name: MySQL 8.0.28 (Aurora version, no GTID) /w docker-compose
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

# MySQL 8.0.28 is the oldest version Spirit tests against. It is the base of
# Aurora MySQL 3.04 (LTS), whose standard support ends on 2026-10-31. After the
# v0.18.0 release this runner moves to the next supported Aurora LTS (Aurora
# MySQL 3.10, MySQL 8.0.42), and the minimum tested version rises with it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect non-docs changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

      # This runner boots MySQL without GTIDs (nogtid.yml overlay), doubling
      # as the full-suite coverage for the binlog file+offset change source:
      # the coordinate scheme is auto-detected per server, and every other
      # full-suite runner boots GTID-on so it exercises only the GTID client.
      # It also matches real Aurora MySQL, where GTIDs default to off.
      - name: Test
        if: steps.filter.outputs.code == 'true'
        run: docker compose -f compose.yml -f 8.0.28.yml -f nogtid.yml up mysql test --abort-on-container-exit
        working-directory: compose

      - name: Skip — documentation-only change
        if: steps.filter.outputs.code != 'true'
        run: echo "Documentation-only change detected; skipping tests."
