name: MySQL XA guard (isolated) /w docker-compose
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The XA guards depend on how the server writes XA prepare and commit
      # events to the binlog, so they run on 8.4 (the base compose.yml image)
      # and on 8.0, which Aurora MySQL 3 is based on.
      matrix:
        include:
          - name: '8.4'
            compose-files: -f compose.yml
          - name: '8.0.46'
            compose-files: -f compose.yml -f 8.0.46.yml
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect non-docs changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

      - name: Test XA stream guards
        if: steps.filter.outputs.code == 'true'
        env:
          COMPOSE_FILES: ${{ matrix.compose-files }}
        run: docker compose $COMPOSE_FILES --profile xa up mysql xa-test --abort-on-container-exit --exit-code-from xa-test
        working-directory: compose

      - name: Skip — documentation-only change
        if: steps.filter.outputs.code != 'true'
        run: echo "Documentation-only change detected; skipping tests."
